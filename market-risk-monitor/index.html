<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美股风险温度计</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f7f6, #101411);
      --surface: light-dark(#ffffff, #171d19);
      --soft: light-dark(#f0f4f2, #202820);
      --ink: light-dark(#15201a, #edf5ef);
      --muted: light-dark(#607067, #abb8af);
      --line: light-dark(#d7dfda, #334039);
      --green: #16875a;
      --yellow: #a86f00;
      --orange: #c4491b;
      --red: #b3232f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 24px auto;
      display: grid;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .score {
      font-size: 56px;
      font-weight: 780;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .range {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      margin-top: 5px;
    }

    .meter {
      height: 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow), var(--green));
      position: relative;
      margin: 18px 0 14px;
    }

    .needle {
      position: absolute;
      top: -7px;
      width: 4px;
      height: 30px;
      border-radius: 4px;
      background: var(--ink);
      transform: translateX(-2px);
      transition: left 180ms ease;
    }

    .verdict {
      display: grid;
      gap: 8px;
      padding: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .state {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 20px;
      font-weight: 780;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--yellow);
      flex: 0 0 auto;
    }

    .action {
      color: var(--muted);
      font-size: 14px;
    }

    .meta {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 5px;
    }

    .table {
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 98px 1fr 68px 54px;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }

    .name {
      font-weight: 760;
      min-width: 0;
    }

    .detail {
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .value,
    .points {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .points {
      color: var(--muted);
      font-weight: 760;
    }

    .loading,
    .error {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
    }

    .error { color: var(--red); }

    @media (max-width: 800px) {
      main { width: min(100% - 22px, 1080px); margin: 14px auto; }
      header { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 82px 1fr 56px 44px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>美股风险温度计</h1>
        <div class="subtitle">VIX / VXN / Put-Call / 10Y / DXY / Nasdaq / VIX期限结构</div>
      </div>
      <button id="refresh" type="button">刷新</button>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="score-row">
          <div>
            <div class="subtitle">今日市场环境</div>
            <div class="state"><span id="dot" class="dot"></span><span id="state">Loading</span></div>
          </div>
          <div>
            <div id="score" class="score">--</div>
            <div class="range">-7 到 +7</div>
          </div>
        </div>
        <div class="meter" aria-hidden="true"><div id="needle" class="needle"></div></div>
        <div class="verdict">
          <div id="action" class="action">正在获取市场数据...</div>
        </div>
        <div class="meta">
          <div id="updated">最后更新：--</div>
          <div>自动刷新：每 5 分钟；数据源可能延迟。</div>
          <div>仅供交易计划参考，不构成投资建议。</div>
        </div>
      </div>

      <div class="panel">
        <div id="rows" class="table">
          <div class="loading">正在加载...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const rowsNode = document.getElementById("rows");
    const scoreNode = document.getElementById("score");
    const stateNode = document.getElementById("state");
    const actionNode = document.getElementById("action");
    const updatedNode = document.getElementById("updated");
    const needleNode = document.getElementById("needle");
    const dotNode = document.getElementById("dot");
    const refreshButton = document.getElementById("refresh");

    const colors = {
      green: "#16875a",
      yellow: "#a86f00",
      orange: "#c4491b",
      red: "#b3232f"
    };

    function colorFor(score) {
      if (score >= 4) return colors.green;
      if (score >= 1) return colors.yellow;
      if (score >= -3) return colors.orange;
      return colors.red;
    }

    function trendText(trend) {
      if (trend === "up") return "上升";
      if (trend === "down") return "下降";
      return "稳定";
    }

    function valueText(row) {
      if (row.id === "term") return row.value;
      if (!Number.isFinite(row.value)) return "--";
      const digits = row.id === "putcall" || row.id === "teny" ? 2 : 1;
      const suffix = row.unit || "";
      return `${row.value.toFixed(digits)}${suffix}`;
    }

    function render(data) {
      const score = data.score.score;
      const color = colorFor(score);
      scoreNode.textContent = score > 0 ? `+${score}` : String(score);
      scoreNode.style.color = color;
      dotNode.style.background = color;
      stateNode.textContent = data.score.state;
      actionNode.textContent = data.score.action;
      updatedNode.textContent = `最后更新：${new Date(data.updatedAt).toLocaleString()}`;
      needleNode.style.left = `${Math.max(0, Math.min(100, ((score + 7) / 14) * 100))}%`;

      rowsNode.innerHTML = "";
      data.score.rows.forEach((row) => {
        const node = document.createElement("div");
        node.className = "row";
        node.innerHTML = `
          <div class="name">${row.label}</div>
          <div class="detail">${trendText(row.trend)} / ${row.note || ""}${row.date ? ` / ${row.date}` : ""}</div>
          <div class="value">${valueText(row)}</div>
          <div class="points">${row.points > 0 ? "+" : ""}${row.points}</div>
        `;
        rowsNode.appendChild(node);
      });

      const errors = data.items.filter((item) => item.error);
      if (errors.length) {
        const node = document.createElement("div");
        node.className = "error";
        node.textContent = `部分数据暂不可用：${errors.map((item) => item.label).join("、")}`;
        rowsNode.appendChild(node);
      }
    }

    async function load(force = false) {
      refreshButton.disabled = true;
      try {
        const response = await fetch(`/api/market${force ? "?force=1" : ""}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        rowsNode.innerHTML = `<div class="error">加载失败：${error.message}</div>`;
        stateNode.textContent = "Offline";
        actionNode.textContent = "请确认本地服务仍在运行。";
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", () => load(true));
    load();
    setInterval(load, 5 * 60 * 1000);
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Market Intelligence Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="terminal-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <strong>US MID</strong>
          <small data-i18n="brand.subtitle">Market Intelligence</small>
        </div>
      </div>
      <nav id="nav">
        <button data-page="dashboard" data-i18n="nav.dashboard" class="active">Dashboard</button>
        <button data-page="regime" data-i18n="nav.regime">Market Regime</button>
        <button data-page="volatility" data-i18n="nav.volatility">Volatility</button>
        <button data-page="breadth" data-i18n="nav.breadth">Breadth</button>
        <button data-page="sectors" data-i18n="nav.sectors">Sectors</button>
        <button data-page="macro" data-i18n="nav.macro">Macro</button>
        <button data-page="credit" data-i18n="nav.credit">Credit</button>
        <button data-page="events" data-i18n="nav.events">Events</button>
        <button data-page="earnings" data-i18n="nav.earnings">Earnings</button>
        <button data-page="scanner" data-i18n="nav.scanner">Stock Scanner</button>
        <button data-page="portfolio" data-i18n="nav.portfolio">Portfolio</button>
        <button data-page="backtest" data-i18n="nav.backtest">Backtest</button>
        <button data-page="ai" data-i18n="nav.ai">AI Analyst</button>
        <button data-page="settings" data-i18n="nav.settings">Settings</button>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 data-i18n="app.title">US Market Intelligence Dashboard</h1>
          <p data-i18n="app.subtitle">Market Data -> Regime -> Risk -> Scanner -> Brief</p>
        </div>
        <div class="status-strip">
          <span id="market-status">Loading</span>
          <span id="data-delay">Delayed</span>
          <span id="updated-at">--</span>
          <div class="lang-toggle" aria-label="Language">
            <button id="lang-zh" type="button" data-lang="zh">中文</button>
            <button id="lang-en" type="button" data-lang="en">EN</button>
          </div>
          <button id="refresh" type="button" data-i18n="actions.refresh">Refresh</button>
        </div>
      </header>

      <section id="alerts" class="alert-strip"></section>
      <section id="page"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
